<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base-url" content="">
    <title>Field Notes News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #eef3f1;
            --surface: #ffffff;
            --ink: #14262b;
            --muted: #5a6e72;
            --line: #d3dedb;
            --accent: #3b4cca;
            /* swapped per category by JS */
            --display: "Bricolage Grotesque", system-ui, sans-serif;
            --body: "Source Serif 4", Georgia, serif;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1c20;
            --surface: #172a30;
            --ink: #e8f0ee;
            --muted: #94a8ab;
            --line: #274047;
        }

        :root[data-theme="light"] {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--body);
            line-height: 1.55;
        }

        .wrap {
            max-width: 1160px;
            margin: 0 auto;
            padding: 40px 24px 72px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            padding: 8px 0 26px;
            border-bottom: 1px solid var(--line);
        }

        .header-copy {
            min-width: 0;
        }

        .theme-toggle {
            display: flex;
            flex: 0 0 auto;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
        }

        .theme-toggle button {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            font: 1.25rem/1 system-ui, sans-serif;
            cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .theme-toggle button[aria-pressed="true"] {
            background: var(--accent);
            color: #fff;
        }

        .theme-toggle button:hover:not([aria-pressed="true"]) {
            background: var(--bg);
            color: var(--ink);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font: 700 0.75rem var(--display);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        header h1 {
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: -0.02em;
            margin: 0 0 4px;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        /* Category tabs: the active tab sets the accent for the whole page */
        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 24px 0 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--accent);
        }

        nav button {
            font: 500 0.95rem var(--display);
            padding: 8px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
        }

        nav button:hover {
            border-color: var(--accent);
        }

        nav button[aria-selected="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        #feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        article {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 4px solid var(--accent);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgb(20 38 43 / 5%);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        @media (hover: hover) {
            article:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 28px rgb(20 38 43 / 12%);
            }
        }

        article img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: var(--line);
        }

        .body {
            padding: 18px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .meta {
            font-size: 0.82rem;
            color: var(--muted);
        }

        article h2 {
            font: 700 1.15rem/1.3 var(--display);
            margin: 0;
        }

        article h2 a {
            color: inherit;
            text-decoration: none;
        }

        article h2 a:hover {
            text-decoration: underline;
            text-decoration-color: var(--accent);
        }

        article p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--muted);
        }

        /* Loading skeletons */
        .skeleton {
            min-height: 280px;
            background: linear-gradient(90deg, var(--surface) 25%, var(--line) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .skeleton {
                animation: none;
            }
        }

        /* Animated "Loading..." indicator */
        .loading {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            padding: 20px 0 4px;
            font: 700 1.4rem var(--display);
            letter-spacing: 0.04em;
            color: var(--accent);
        }

        .dot {
            animation: blink 1.2s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .dot:nth-child(4) {
            animation-delay: 0.6s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0.15;
            }

            40% {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot {
                animation: none;
            }
        }

        .message {
            grid-column: 1 / -1;
            padding: 32px;
            text-align: center;
            background: var(--surface);
            border: 1px dashed var(--line);
            border-radius: 6px;
        }

        .message strong {
            display: block;
            font-family: var(--display);
            margin-bottom: 4px;
        }

        #more {
            display: block;
            margin: 28px auto 0;
            font: 500 1rem var(--display);
            padding: 10px 24px;
            border: 2px solid var(--accent);
            border-radius: 999px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease;
        }

        #more:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
        }

        #more:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #more[hidden] {
            display: none;
        }

        @media (max-width: 520px) {
            .wrap {
                padding: 28px 16px 48px;
            }

            header {
                gap: 12px;
            }

            .theme-toggle button {
                width: 34px;
                height: 34px;
            }

            nav {
                margin: 20px 0 22px;
            }

            nav button {
                padding: 8px 13px;
            }

            #feed {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            nav button,
            article,
            #more,
            .theme-toggle button {
                transition: none;
            }

            article:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="header-copy">
                <p class="eyebrow">The daily brief</p>
                <h1>Field Notes News</h1>
                <p>Latest headlines on politics, weather, sports and farming.</p>
            </div>
            <div class="theme-toggle" role="group" aria-label="Color theme">
                <button id="light-theme" type="button" aria-label="Use light theme" aria-pressed="false"
                    title="Light theme">☀</button>
                <button id="dark-theme" type="button" aria-label="Use dark theme" aria-pressed="false"
                    title="Dark theme">☾</button>
            </div>
        </header>

        <nav id="tabs" role="tablist" aria-label="News categories"></nav>
        <main id="feed" aria-live="polite"></main>
        <button id="more" hidden>Load more</button>
    </div>

    <script>
        const themeButtons = {
            light: document.getElementById("light-theme"),
            dark: document.getElementById("dark-theme"),
        };
        const savedTheme = localStorage.getItem("news-theme");
        const initialTheme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("news-theme", theme);
            Object.entries(themeButtons).forEach(([name, button]) =>
                button.setAttribute("aria-pressed", String(name === theme))
            );
        }

        Object.entries(themeButtons).forEach(([theme, button]) =>
            button.addEventListener("click", () => setTheme(theme))
        );
        setTheme(initialTheme);

        // ---- Config ------------------------------------------------------------
        const CATEGORIES = [
            { id: "politics", label: "Politics", color: "#3b4cca" },
            { id: "weather", label: "Weather", color: "#0e86a8" },
            { id: "sports", label: "Sports", color: "#d9480f" },
            { id: "agriculture", label: "Agriculture & Farming", color: "#3f8a24" },
        ];
        const PAGE_SIZE = 12;
        const API_BASE_URL = document.querySelector('meta[name="api-base-url"]').content
            .trim()
            .replace(/\/$/, "");

        // ---- State -------------------------------------------------------------
        const state = { category: CATEGORIES[0].id, page: 1, total: 0, loaded: 0, busy: false };

        // ---- DOM references ----------------------------------------------------
        const tabsEl = document.getElementById("tabs");
        const feedEl = document.getElementById("feed");
        const moreBtn = document.getElementById("more");

        // ---- Helpers that build DOM nodes --------------------------------------
        function el(tag, props = {}, ...children) {
            const node = document.createElement(tag);
            Object.assign(node, props);          // textContent, className, href, etc.
            node.append(...children);
            return node;
        }

        function formatDate(iso) {
            if (!iso) return "";
            return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        }

        function buildCard(a) {
            const card = el("article");

            if (a.image) {
                const img = el("img", { src: a.image, alt: "", loading: "lazy" });
                img.addEventListener("error", () => img.remove());   // hide broken images
                card.append(img);
            }

            const link = el("a", { href: a.url, target: "_blank", rel: "noopener noreferrer", textContent: a.title });
            const body = el("div", { className: "body" },
                el("div", { className: "meta", textContent: [a.source, formatDate(a.publishedAt)].filter(Boolean).join(" · ") }),
                el("h2", {}, link),
            );
            if (a.description) body.append(el("p", { textContent: a.description }));

            card.append(body);
            return card;
        }

        function showMessage(title, text) {
            feedEl.replaceChildren(
                el("div", { className: "message" }, el("strong", { textContent: title }), text)
            );
            moreBtn.hidden = true;
        }

        // "Loading" followed by three dots that pulse one after another
        function loadingNodes() {
            return ["Loading", ...Array.from({ length: 3 }, () => el("span", { className: "dot", textContent: "." }))];
        }

        function showSkeletons() {
            const loader = el("div", { className: "loading" }, ...loadingNodes());
            loader.setAttribute("role", "status");
            feedEl.replaceChildren(
                loader,
                ...Array.from({ length: 6 }, () => el("div", { className: "skeleton" }))
            );
        }

        // ---- Tabs --------------------------------------------------------------
        function renderTabs() {
            tabsEl.replaceChildren(...CATEGORIES.map(c => {
                const btn = el("button", { textContent: c.label });
                btn.setAttribute("role", "tab");
                btn.dataset.id = c.id;
                return btn;
            }));
            updateTabs();
        }

        function updateTabs() {
            const active = CATEGORIES.find(c => c.id === state.category);
            document.documentElement.style.setProperty("--accent", active.color);
            [...tabsEl.children].forEach(btn =>
                btn.setAttribute("aria-selected", String(btn.dataset.id === state.category))
            );
        }

        // One listener on the parent handles every tab (event delegation)
        tabsEl.addEventListener("click", e => {
            const btn = e.target.closest("button[data-id]");
            if (!btn || btn.dataset.id === state.category) return;
            state.category = btn.dataset.id;
            updateTabs();
            loadNews({ reset: true });
        });

        moreBtn.addEventListener("click", () => loadNews({ reset: false }));

        // ---- Fetching ----------------------------------------------------------
        async function loadNews({ reset }) {
            if (state.busy) return;
            state.busy = true;

            if (reset) {
                state.page = 1;
                state.loaded = 0;
                showSkeletons();
                moreBtn.hidden = true;
            } else {
                state.page += 1;
                moreBtn.disabled = true;
                moreBtn.replaceChildren(...loadingNodes());
            }

            try {
                const url = `${API_BASE_URL}/api/news?category=${encodeURIComponent(state.category)}&page=${state.page}&page_size=${PAGE_SIZE}`;
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Something went wrong.");

                if (reset) feedEl.replaceChildren();   // clear skeletons

                if (data.articles.length === 0 && reset) {
                    showMessage("No stories found", "Try another category or check back later.");
                    return;
                }

                feedEl.append(...data.articles.map(buildCard));
                state.total = data.total;
                state.loaded += data.articles.length;
                moreBtn.hidden = state.loaded >= state.total || data.articles.length === 0;
            } catch (err) {
                if (reset) showMessage("Couldn't load the news", err.message);
                else state.page -= 1;                  // let the user retry the same page
            } finally {
                state.busy = false;
                moreBtn.disabled = false;
                moreBtn.textContent = "Load more";
            }
        }

        // ---- Start -------------------------------------------------------------
        renderTabs();
        loadNews({ reset: true });
    </script>
</body>

</html>
