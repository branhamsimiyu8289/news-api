services:
  - type: web
    name: news-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: NEWS_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
